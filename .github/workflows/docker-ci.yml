name: Docker CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Students Arcade Docker image
        run: docker build -t students-arcade:ci .

      - name: Run Students Arcade container smoke test
        run: docker run --rm students-arcade:ci